services:
  monitor:
    build: .
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  refresh:
    build: .
    command: python run_monitor.py --refresh
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  dashboard:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
